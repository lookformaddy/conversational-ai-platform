[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conversational-ai-platform"
version = "1.0.0"
description = "Multi-turn dialogue manager for enterprise support: deterministic NLU, state tracking, policy-driven actions, handoff, analytics, eval harness."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
