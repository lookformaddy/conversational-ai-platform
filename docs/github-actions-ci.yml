# CI — Conversational AI Platform
# NOTE: this file lives at docs/github-actions-ci.yml (not .github/workflows/)
# because the GitHub App used to push this repo lacks the Workflows
# permission. To activate CI, move it to .github/workflows/ci.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Run eval harness
        run: python -m convai.cli --eval
